schema_version: 2
framework:
  name: ai-dev-forge
version: 4.8.0

platforms:
  codex:
    enabled: true
  claude:
    enabled: true
  opencode:
    enabled: true

# Required before Epic planning or Task review. Bootstrap or migration must
# replace null with one explicitly approved value: claude_with_codex,
# codex_with_claude, or native_subagents. For an OpenCode-led setup with no
# prior approved route, propose native_subagents by default; still require
# explicit approval and preserve an existing approved value during migration.
role_execution:
  mode: null

models:
  codex:
    strong: {model: gpt-5.6-sol, reasoning_effort: medium}
    balanced: {model: gpt-5.6-terra, reasoning_effort: medium}
    fast: {model: gpt-5.6-luna, reasoning_effort: medium}
  claude:
    strong: {model: opus, effort: medium}
    balanced: {model: sonnet, effort: medium}
    fast: {model: haiku, effort: medium}
  # OpenCode has no provider-independent model default. When the platform is
  # enabled, resolve every null from explicit user input or evidenced local
  # `opencode models` output. Values must use provider/model-id form.
  opencode:
    strong: {model: null}
    balanced: {model: null}
    fast: {model: null}

documentation_language: null
framework_language: en

git:
  policy: manual

# Local integrations are deliberately not configured here. A clean Forge
# project has no `.ai/integrations/`. When needed, create project-owned
# definitions from `.ai/templates/integration.yaml`; never store credentials.

# Populate only from confirmed repository, build-system, and CI evidence.
# An empty profile or command list must be resolved in the approved Epic plan as
# not applicable or as an explicit blocker; it is not permission to invent,
# silently skip, or substitute a command.
quality:
  profiles: []
  task:
    focused_test_commands: []
    affected_test_commands: []
    scoped_lint_commands: []
    scoped_typecheck_commands: []
    scoped_build_commands: []
  epic:
    full_test_suite_commands: []
    project_lint_commands: []
    project_typecheck_commands: []
    project_build_commands: []
    integration_commands: []
    e2e_commands: []
  selection_rules: []

# Optional and lifecycle-independent. Leave null unless the user separately
# approves a mutation backend and every command is supported by repository,
# build-system, or CI evidence. Bootstrap and migration never install a backend
# or create `quality/mutation-testing/` history.
mutation_testing:
  backend: null
  version_command: null
  baseline_command: null
  mutation_command: null
  result_adapter: null
  scope_syntax: null
  execution_constraints: []
  budgets:
    timeout_seconds: null
    workers: null
    maximum_candidates: null
  artifact_policy: compact_only
