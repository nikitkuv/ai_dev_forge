schema_version: 1
framework:
  name: ai-dev-forge
  version: 4.2.0

platforms:
  codex:
    enabled: true
  claude:
    enabled: true

models:
  codex:
    strong: {model: gpt-5.6-sol, reasoning_effort: high}
    balanced: {model: gpt-5.6-terra, reasoning_effort: medium}
    fast: {model: gpt-5.6-luna, reasoning_effort: medium}
  claude:
    strong: {model: opus, effort: high}
    balanced: {model: sonnet, effort: high}
    fast: {model: haiku, effort: high}

documentation_language: null
framework_language: en

git:
  policy: manual

# Local integrations are deliberately not configured here. A clean Forge
# project has no `.ai/integrations/`. When needed, create project-owned
# definitions from `.ai/templates/integration.yaml`; never store credentials.

# Populate only from confirmed repository, build-system, and CI evidence.
# An empty profile or command list must be resolved in the approved Epic plan as
# not applicable or as an explicit blocker; it is not permission to invent,
# silently skip, or substitute a command.
quality:
  profiles: []
  task:
    focused_test_commands: []
    affected_test_commands: []
    scoped_lint_commands: []
    scoped_typecheck_commands: []
    scoped_build_commands: []
  epic:
    full_test_suite_commands: []
    project_lint_commands: []
    project_typecheck_commands: []
    project_build_commands: []
    integration_commands: []
    e2e_commands: []
  selection_rules: []
