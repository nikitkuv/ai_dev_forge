framework:
  name: ai-dev-forge
  version: 4.6.0
  schema_version: 2

adapters: [codex, claude]

ownership:
  framework_owned_paths:
    - .ai/BOOTSTRAP.md
    - .ai/MIGRATE.md
    - .ai/01-product-discovery.md
    - .ai/02-system-design.md
    - .ai/03-release-planning.md
    - .ai/04-prepare-workspace.md
    - .ai/05-create-platform-adapters.md
    - .ai/06-final-validation.md
    - .ai/CONVENTIONS.md
    - .ai/framework/
    - .ai/templates/
  project_owned_paths:
    - .ai/project.yaml
    - .ai/framework.lock
    - .ai/custom/
    - .ai/integrations/
    - README.md
    - SPEC.md
    - ARCHITECTURE.md
    - BACKLOG.md
    - DECISIONS.md
    - decisions/
    - execution/
    - quality/mutation-testing/
    - hooks/
    - mcp/
  generated_adapter_outputs:
    - AGENTS.md
    - CLAUDE.md
    - .codex/
    - .claude/
    - .agents/
  generated_adapter_policy:
    regeneration: adapter sync and framework migration regenerate these outputs from framework sources and project configuration.
    manual_edit_collision: detect manual edits, show the regeneration diff, and require explicit confirmation before overwriting them.
    managed_membership: only root routers and entries whose IDs are declared in subagents or skills are Forge-managed.
    unlisted_membership: preserve unlisted agents, skills, and adjacent platform files as project-owned content.
    protected_platform_files: never generate or replace .codex/config.toml, Claude settings, commands, or hooks.

skills:
  - forge-bootstrap-new
  - forge-bootstrap-existing
  - forge-intake-feature
  - forge-intake-bug
  - forge-intake-external-work
  - forge-reprioritize-backlog
  - forge-prepare-epic
  - forge-resume-development
  - forge-run-task
  - forge-complete-task
  - forge-complete-epic
  - forge-migrate-framework
  - forge-security-audit
  - forge-mutation-test
  - forge-check-framework
  - forge-sync-adapters

subagents: [context-collector, documentation-researcher, epic-planner, implementer, reviewer, tester, epic-validator, fuzzer, security-auditor, mutation-runner, mutation-analyzer]

role_execution:
  config_path: role_execution.mode
  roles: [epic-planner, reviewer]
  supported_modes: [claude_with_codex, codex_with_claude, native_subagents]
  fallback: forbidden
  routes:
    claude_with_codex:
      orchestrator: claude
      provider: codex-plugin-cc
      plugin_id: codex@openai-codex
      minimum_plugin_version: 1.0.6
      launcher: .claude/forge/codex-role-runner.mjs
      model: gpt-5.6-sol
      reasoning_effort: medium
      permission_mode: read_only
      fresh: true
    codex_with_claude:
      orchestrator: codex
      provider: claude-code-cli
      minimum_cli_version: 2.1.203
      launcher: .codex/forge/claude-role-runner.mjs
      model_source: models.claude.strong
      permission_mode: plan
      tools: [Read, Grep, Glob, Bash]
      disallowed_tools: [Edit, Write, NotebookEdit, Agent, Task, TeamCreate, TeamDelete, SendMessage, WebFetch, WebSearch, Chrome, "mcp__*"]
      fresh: true
      session_persistence: false
    native_subagents:
      orchestrator: active_platform
      provider: native
      external_preflight: false
      claude_reasoning_effort: high

optional_capabilities:
  hooks: false
  mcp: false
  cli: false
  local_integrations:
    supported: true
    generated_by_default: false
  mutation_testing:
    supported: true
    generated_by_default: false
    backend_required_by_default: false
