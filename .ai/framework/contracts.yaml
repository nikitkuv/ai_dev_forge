schema_version: 1

python_automation:
  source: .ai/tools/forge.py
  required_runtime: false
  model_free_operations: [inventory, section_extraction, fingerprints, structural_validation, adapter_rendering, approved_command_execution, usage_aggregation]
  semantic_authority: orchestrator_and_existing_role_contracts
  unknown_or_incomplete_evidence: requires_inspection
  context_loading: metadata_first_then_relevant_sections
  context_collector: unresolved_interpretation_only
  check_reuse:
    default: disabled
    requires: [explicit_opt_in, approved_complete_inputs, unchanged_files_commands_runtime_environment, prior_success, intact_local_logs]
    forbidden: [epic_validation, external_mutable_state, replacing_test_integrity, replacing_review, inferring_acceptance]
  local_artifacts: .ai/local/
  local_artifact_authority: noncanonical
  task_start_authorization:
    default: strict
    optional_mode: bounded_task_starts
    requires: [explicit_user_decision, approver, future_expiry, exact_task_path, unchanged_definition_fingerprint, ordinary_start_preconditions]
    grants_only: Task_Start
    never_grants: [Task_Acceptance, Epic_Start, Epic_Acceptance, Replan, commit, scope_expansion]

integration_contracts:
  source: .ai/framework/integrations/contracts.yaml
  optional_registry: .ai/integrations/
  clean_project_requires_registry: false
  invocation_requires: [enabled_definition, compatible_profile, explicit_consumer, allowed_operation, active_platform_binding, resource_scope]
  framework_update_requires_live_connector: false

enums:
  epic_readiness: [OUTLINE, READY]
  epic_status:
    [PLANNED, ACTIVE, VALIDATING, FUZZING, "AWAITING EPIC ACCEPTANCE", COMPLETED, PAUSED, CANCELLED]
  task_status:
    [TODO, "IN PROGRESS", "IN REVIEW", "IN TESTING", "AWAITING USER ACCEPTANCE", DONE, PAUSED, CANCELLED]
  bug_status: [OPEN, SCHEDULED, RESOLVED, REJECTED, DUPLICATE, WONT_FIX]
  adr_status: [PROPOSED, ACCEPTED, REJECTED, SUPERSEDED, DEPRECATED]
  model_tiers: [strong, balanced, fast]
  delivery_tracks: [fast, standard]
  fuzzing_outcomes: [PASSED, "HARNESS REQUIRED", FINDINGS, "NOT APPLICABLE"]
  epic_validation_outcomes: [PASSED, "PASSED WITH ACCEPTED EXCEPTIONS", FAILED, BLOCKED]
  task_risk_levels: [low, standard, high]
  quality_profiles: [backend, frontend, ml, data_pipeline, infrastructure, library_cli]
  mutation_run_outcomes: [COMPLETED, PARTIAL, INCONCLUSIVE, "SETUP REQUIRED", BLOCKED, CANCELLED]
  mutation_analysis_statuses: [not_requested, skipped_no_candidates, completed, partial, blocked, stale]
  investigation_outcomes: [no_action, promoted, fixed_directly, unresolved]

ad_hoc_investigations:
  invocation: explicit_user_request
  execution_owner: orchestrator
  subagent_invocation: forbidden
  lifecycle_coupling: forbidden
  record:
    id_format: INV-NNNN
    path_glob: investigations/INV-*.md
    allocate_from_prior_maximum: true
    create_for_material_investigation: true
    required_frontmatter: [document_type, id, subject, area, outcome, created_at, updated_at, baseline_revision, relevant_paths, research_refs]
    required_sections: [Question, Scope, Investigation, Evidence, Causes, Conclusion, Next Action, Linked Work, Outcome History]
    facts_and_inferences_separated: true
  outcomes:
    no_action:
      requires: [reason, future_recommendation_or_not_applicable]
    promoted:
      requires: [approved_bug_epic_replan_or_task_reference, reciprocal_research_ref]
    fixed_directly:
      requires: [explicit_fix_authorization, complete_change_ledger, proportionate_verification, final_revision_commit_or_scoped_diff]
    unresolved:
      requires: [remaining_hypotheses, blockers, next_experiments]
  direct_fix:
    task_start_required: false
    generated_subagents: forbidden
    scope: user_authorized_investigated_problem
    requires: [preserved_unrelated_changes, resolved_product_and_architecture_decisions, proportionate_verification]
    change_ledger_requires: [added_paths, modified_paths, removed_paths, per_path_what_and_why, material_effects, verification_commands_and_results, remaining_risks, final_revision_commit_or_scoped_diff]
    complete_diff_duplication: not_required
  planning_reuse:
    explicit_reference_field: research_refs
    discover_by: [subject, area, relevant_paths]
    uncertain_match_requires: user_confirmation
    applicability_check: [baseline_revision, relevant_path_changes, material_assumptions]
    reuse: [evidence, causes, risks, suggested_fix, suggested_verification]
    approved_work_requires_reciprocal_reference: true
  development_effects:
    automatic_bug_epic_task_or_replan: forbidden
    lifecycle_status_changes: forbidden
    gate_satisfaction: forbidden
    user_acceptance_inference: forbidden
    commit_authorization_inference: forbidden
    stale_existing_evidence: report_through_existing_resume_and_validation

mutation_testing:
  invocation: explicit_user_request_only
  lifecycle_coupling: forbidden
  default_mode: metrics_only
  optional_registry: quality/mutation-testing/
  clean_project_requires_registry: false
  backend_required_by_default: false
  install_or_configuration_requires: separate_explicit_user_authorization
  run_packet_requires:
    - mutation_run_id
    - repository_root
    - source_scope
    - test_scope
    - exclusions
    - base_revision
    - scoped_fingerprint
    - baseline_command
    - mutation_command
    - backend_identity_and_version
    - execution_budget
    - runtime_artifact_destination
  runner:
    model_tier: fast
    baseline_first: true
    fingerprint_checks: [before_baseline, before_mutation, after_mutation]
    write_policy: runtime_artifacts_only
    normalized_metrics: [generated, killed, survived, no_coverage, timeout, invalid_or_error, duration, backend_reported_score]
    forbidden: [tool_installation, tracked_source_edits, tracked_test_edits, apply_mutant, lifecycle_edits, development_work_creation, agent_spawning]
  analyzer:
    model_tier: strong
    explicit_authorization_required: true
    invocation_requires: [current_run_fingerprint, current_artifact_checksums, positive_analysis_budget, analysis_candidates]
    candidates: [survived, no_coverage, explicitly_configured]
    skip_when: [analysis_not_requested, no_candidates, baseline_failed, setup_required, unusable_run, stale_artifacts, zero_budget]
    supports_deferred_analysis_without_rerun: true
    write_policy: runtime_artifacts_only
    classifications: [actionable_test_gap, likely_equivalent, low_value, unreachable_code, wrong_test_selection, production_defect_suspected, unresolved]
    forbidden: [tool_installation, source_edits, test_edits, remediation, lifecycle_edits, development_work_creation, agent_spawning]
  records:
    id_format: MUT-NNNN
    registry: quality/mutation-testing/registry.yaml
    run_glob: quality/mutation-testing/runs/MUT-*.yaml
    allocate_for_every_attempt: true
    orchestrator_owned_updates: true
    raw_artifacts_tracked_by_default: false
    run_required_fields: [schema_version, id, started_at, run, scope, fingerprint, tool, budget, baseline, results, artifacts, analysis, disposition]
    analysis_updates_same_run: true
  development_effects:
    lifecycle_status_changes: forbidden
    gate_satisfaction: forbidden
    evidence_invalidation: forbidden
    automatic_bug_task_epic_or_replan: forbidden
    follow_up_requires: separate_user_decision_and_existing_workflow

# Stable machine-friendly spellings for status values that contain spaces.
machine_tokens:
  AWAITING_EPIC_ACCEPTANCE: "AWAITING EPIC ACCEPTANCE"
  AWAITING_USER_ACCEPTANCE: "AWAITING USER ACCEPTANCE"

delivery_tracks:
  default: standard
  legacy_missing_delivery_track: standard
  independent_from: [model_tier, task_risk_level, quality_profile, lifecycle_status]
  selection:
    approval_source: [epic_plan_approval, replan]
    revalidate_at: [task_start, post_implementation_assurance]
    uncertainty_policy: standard
  fast:
    requires: [bounded_scope, reversible_change, risk_level_low, unambiguous_expected_behavior, deterministic_focused_verification, no_disqualifier]
    disqualifiers: [public_contract, authorization, security, privacy, persistence, data_format, schema, migration, concurrency, shared_core, dependency, production_build, packaging, deployment, runtime_infrastructure, external_integration, critical_user_or_system_path, test_weakening, unresolved_affected_surface, unresolved_verification]
    implementation_agent: implementer
    assurance_owner: orchestrator
    forbidden_agents: [reviewer, tester]
    evidence: [current_whole_implementation_fingerprint, exact_scoped_diff, current_fast_eligibility, acceptance_and_risk_traceability, production_and_supporting_path_classification, test_integrity, reproduced_selected_checks, fast_assurance_outcome_PASSED]
  standard:
    implementation_agent: implementer
    assurance_agents: [reviewer, tester]
    requires: [current_structured_review, current_task_test_evidence]
  escalation:
    fast_to_standard:
      disposition: allowed_and_required_on_eligibility_failure
      invalidates: fast_assurance
      unchanged_scope_requires_replan: false
    standard_to_fast_after_task_start:
      disposition: forbidden
    standard_to_fast_before_task_start:
      requires: [plan_approval_or_replan, complete_fast_eligibility_evidence]

transitions:
  epic_readiness:
    OUTLINE: [READY]
  epic_status:
    PLANNED: [ACTIVE, PAUSED, CANCELLED]
    ACTIVE: [VALIDATING, PAUSED, CANCELLED]
    VALIDATING: [FUZZING, ACTIVE, PAUSED, CANCELLED]
    FUZZING: ["AWAITING EPIC ACCEPTANCE", ACTIVE, PAUSED, CANCELLED]
    "AWAITING EPIC ACCEPTANCE": [COMPLETED, ACTIVE, PAUSED, CANCELLED]
    PAUSED: [PLANNED, ACTIVE, VALIDATING, FUZZING, "AWAITING EPIC ACCEPTANCE", CANCELLED]
  task_status:
    TODO: ["IN PROGRESS", PAUSED, CANCELLED]
    "IN PROGRESS": ["IN REVIEW", "AWAITING USER ACCEPTANCE", PAUSED, CANCELLED]
    "IN REVIEW": ["IN TESTING", "IN PROGRESS", PAUSED, CANCELLED]
    "IN TESTING": ["AWAITING USER ACCEPTANCE", "IN PROGRESS", PAUSED, CANCELLED]
    "AWAITING USER ACCEPTANCE": [DONE, "IN PROGRESS", PAUSED, CANCELLED]
    PAUSED: [TODO, "IN PROGRESS", "IN REVIEW", "IN TESTING", "AWAITING USER ACCEPTANCE", CANCELLED]
  bug_status:
    OPEN: [SCHEDULED, REJECTED, DUPLICATE, WONT_FIX]
    SCHEDULED: [RESOLVED, REJECTED, DUPLICATE, WONT_FIX]
  adr_status:
    PROPOSED: [ACCEPTED, REJECTED]
    ACCEPTED: [SUPERSEDED, DEPRECATED]

gates:
  task_start:
    transition: "TODO -> IN PROGRESS"
    requires: [explicit_user_authorization, approved_delivery_track, current_track_eligibility]
  fast_direct_acceptance:
    transition: "IN PROGRESS -> AWAITING USER ACCEPTANCE"
    requires: [delivery_track_fast, current_fast_assurance, matching_whole_implementation_fingerprint]
    forbidden_for: [delivery_track_standard, missing_or_stale_fast_assurance]
  task_acceptance:
    transition: "AWAITING USER ACCEPTANCE -> DONE"
    requires: [explicit_user_acceptance]
  task_commit:
    allowed_after: task_acceptance
    requires: [task_status_DONE, explicit_user_acceptance, current_track_specific_assurance_evidence, scoped_changes_only]
    manual_policy_additionally_requires: [separate_explicit_user_commit_authorization]
    forbidden_before: task_acceptance
  next_task_start:
    requires: [separate_explicit_user_authorization]
    note: Task acceptance and permission to start the next task are separate gates; one message may authorize both only when it explicitly states both decisions.
  epic_plan_approval:
    effect: "write approved plan and TASK definitions under execution/planned without changing Epic lifecycle status"
    requires: [epic_status_PLANNED, readiness_READY, approved_requirements_and_boundaries, valid_epic_fuzzing_plan_proposal, explicit_user_approval]
    permits: [declared_unsatisfied_dependencies, declared_blockers, another_active_work_epic]
  epic_start:
    transition: "PLANNED -> ACTIVE"
    requires: [readiness_READY, approved_planned_workspace, dependencies_satisfied, no_unresolved_blockers, no_other_nonterminal_active_work_epic, explicit_user_authorization]
    atomic_effects: [move_execution_planned_to_active, update_backlog_status]
  epic_validation:
    transition: "ACTIVE -> VALIDATING"
    requires: [all_planned_tasks_DONE, current_task_evidence, approved_epic_verification_plan, approved_epic_fuzzing_plan]
  epic_fuzzing:
    transition: "VALIDATING -> FUZZING"
    requires: [current_epic_validation_evidence, epic_validation_acceptance_satisfied]
  epic_acceptance:
    transition: "AWAITING EPIC ACCEPTANCE -> COMPLETED"
    requires: [fuzzing_acceptance_satisfied, explicit_user_acceptance]
  replan:
    required_for: [task_scope_change, task_order_change, task_composition_change, delivery_track_downgrade_before_task_start]
    requires: [reason, plan_diff, explicit_user_confirmation]
    not_required_for: [typo_correction, link_correction, unchanged_scope_fast_to_standard_escalation]
    applies_to_workspaces: [planned, active, paused]
  adr_approval:
    transition: "PROPOSED -> ACCEPTED"
    requires: [explicit_user_approval]

fuzzing:
  mandatory_after: epic_validation_acceptance_satisfied
  mandatory_subject: fuzzing_gate
  planning_applicability: [applicable, "not applicable", unresolved]
  plan_requirements:
    applicable: [risk_surfaces, targets_and_invariants, harness_readiness, task_mapping, reproducible_campaign, failure_criteria, artifact_handling, execution_constraints]
    "not applicable": [rationale, alternative_risk_coverage]
    unresolved: [exact_missing_evidence_or_blocker]
  agent_invocation:
    required_when: [planned_applicable, planned_unresolved, final_evidence_contradicts_planned_not_applicable]
    skipped_when:
      - approved_plan_not_applicable
      - all_final_task_fuzzing_impacts_none
      - actual_affected_surface_matches_approved_plan
      - alternative_risk_coverage_passed
      - current_aggregate_fingerprint_matches_epic_validation
    skipped_outcome: "NOT APPLICABLE"
  acceptance_gate:
    id: fuzzing_acceptance_satisfied
    satisfied_by:
      - outcome: PASSED
      - outcome: "NOT APPLICABLE"
        requires: [rationale, alternative_risk_coverage]
  outcomes:
    PASSED:
      transition: "FUZZING -> AWAITING EPIC ACCEPTANCE"
    "NOT APPLICABLE":
      transition: "FUZZING -> AWAITING EPIC ACCEPTANCE"
      requires: [rationale, alternative_risk_coverage]
    "HARNESS REQUIRED":
      transition: "FUZZING -> ACTIVE"
      task_kind: fuzz_harness
      post_transition_sequence:
        - replan_gate
        - separate_task_start_gate
        - full_task_lifecycle
        - repeated_epic_validation
        - "VALIDATING -> FUZZING"
        - repeated_epic_fuzzing
    FINDINGS:
      transition: "FUZZING -> ACTIVE"
      task_kind: remediation
      post_transition_sequence:
        - replan_gate
        - separate_task_start_gate
        - full_task_lifecycle
        - repeated_epic_validation
        - "VALIDATING -> FUZZING"
        - repeated_epic_fuzzing

quality_gates:
  production_review:
    mandatory_for_delivery_track: standard
    production_surface:
      includes: [executable_production_code, runtime_configuration, schemas, migrations, generated_runtime_assets, packaging, production_build, deployment_artifacts]
      criterion: contents_can_change_shipped_behavior
    supporting_evidence:
      includes: [tests, fixtures, snapshots, golden_files, test_only_configuration, development_tooling, examples, other_non_production_artifacts]
      criterion: contents_cannot_change_shipped_behavior
    ambiguous_path_requires: orchestrator_classification_rationale
    canonical_and_lifecycle_records: context_only
    fingerprints: [whole_implementation_fingerprint, production_surface_fingerprint]
    blocking_findings: production_surface_only
    non_production_observations: advisory_only
    clean_with_non_production_observations: permitted
    review_reuse_requires: [prior_outcome_CLEAN, matching_production_surface_fingerprint, complete_packet_integrity]
    supporting_only_change:
      preserves: clean_production_review
      invalidates: affected_task_testing_evidence
      next_gate: task_testing
      strong_reviewer_reinvocation: forbidden
    production_change:
      invalidates: [task_review_evidence, task_testing_evidence, epic_validation_evidence, fuzzing_evidence]
      next_gate: strong_review
    fast_change:
      invalidates: [fast_assurance, epic_validation_evidence, fuzzing_evidence]
      next_gate: orchestrator_fast_assurance_or_standard_escalation
    legacy_evidence_without_production_fingerprint: fresh_review_required
    packet_or_output_integrity_failures: blocking
  test_integrity:
    oracle_sources: [acceptance_criteria, public_contracts, domain_invariants, approved_examples, independent_reference_oracle]
    requires: [acceptance_and_risk_traceability, real_production_logic, stable_public_boundary, discriminating_assertions, applicable_normal_boundary_invalid_error_recovery_state_and_side_effect_cases]
    mocking_policy: external_or_nondeterministic_boundaries_only
    test_change_classifications: [behavior_contract_change, defective_test_correction, coverage_extension]
    weakening_requires: [explicit_rationale, independent_expected_behavior_source, orchestrator_disposition]
    forbidden: [captured_production_output_as_oracle, duplicated_production_algorithm_as_oracle, mocked_subject_under_test, private_call_structure_as_behavior_evidence, tautological_assertions, unexplained_snapshot_fixture_baseline_or_metric_update, adapting_test_to_unchanged_wrong_behavior]
  task:
    requires:
      - approved_definition_with_objective_acceptance_and_boundaries
      - affected_surface_and_risk_flags
      - approved_delivery_track_and_rationale
      - focused_behavior_evidence
      - test_integrity_evidence
      - selected_affected_checks
      - planned_fuzzing_impact_and_task_smoke
      - current_track_specific_assurance_evidence
      - reproducible_manual_verification
      - explicit_task_acceptance
    by_delivery_track:
      fast: [current_fast_eligibility, current_fast_assurance, matching_whole_implementation_fingerprint, orchestrator_reproduced_selected_checks]
      standard: [current_structured_review, current_task_test_evidence]
    full_project_suite: deferred_to_epic_validation
    early_full_project_suite_requires: explicit_user_request
    global_unscoped_checks: deferred_to_epic_validation
    check_removal_requires: explicit_rationale_and_orchestrator_disposition
  epic:
    requires:
      - all_planned_tasks_DONE
      - requirement_to_task_evidence_coverage
      - full_project_test_suite
      - project_wide_lint_typecheck_and_build
      - cross_component_and_critical_path_validation
      - applicable_quality_profile_gates
      - approved_epic_fuzzing_plan
      - current_fuzzing_outcome
      - current_documentation_and_operational_evidence
      - no_unaccepted_blocking_risk
      - explicit_epic_acceptance
  profiles:
    backend: [api_and_schema_contracts, authorization, persistence_and_migration, idempotency, concurrency, failure_handling]
    frontend: [component_behavior, critical_e2e, accessibility, responsive_states, browser_compatibility, production_build]
    ml: [data_quality, leakage_prevention, reproducibility, baseline_comparison, metric_uncertainty, artifact_lineage, training_serving_parity]
    data_pipeline: [schema_evolution, idempotency, backfill, data_quality, lineage, partial_failure_recovery]
    infrastructure: [validate_plan_or_dry_run, least_privilege, rollback, drift, secret_handling, deployment_smoke]
    library_cli: [public_api_compatibility, packaging, supported_runtimes, install_upgrade, cli_exit_and_stream_contracts]

epic_validation:
  mandatory_after: last_task_acceptance
  runs_on: exact_aggregate_revision_or_tree_fingerprint
  acceptance_gate:
    id: epic_validation_acceptance_satisfied
    satisfied_by:
      - outcome: PASSED
      - outcome: "PASSED WITH ACCEPTED EXCEPTIONS"
        requires: [explicit_user_exception_acceptance, recorded_risk]
  outcomes:
    PASSED:
      transition: "VALIDATING -> FUZZING"
    "PASSED WITH ACCEPTED EXCEPTIONS":
      transition: "VALIDATING -> FUZZING"
      requires: [explicit_user_exception_acceptance, recorded_risk]
    FAILED:
      transition: "VALIDATING -> ACTIVE"
      requires: [reproducible_evidence, replan_gate]
    BLOCKED:
      transition: "VALIDATING -> ACTIVE"
      requires: [exact_blocker, risk_statement, replan_or_user_direction]

invariants:
  - material_ad_hoc_investigations_have_durable_INV_records
  - investigations_are_orchestrator_only_and_invoke_no_subagents
  - investigation_outcome_is_no_action_promoted_fixed_directly_or_unresolved
  - direct_investigation_fixes_require_explicit_authorization_and_a_verified_change_ledger
  - investigation_results_never_change_development_lifecycle_automatically
  - planned_work_reusing_investigation_results_has_reciprocal_research_refs
  - mutation_testing_is_explicit_on_demand_and_lifecycle_independent
  - mutation_attempts_have_durable_project_owned_records
  - mutation_runner_is_fast_baseline_first_and_runtime_artifacts_only
  - mutation_analyzer_requires_explicit_authorization_current_candidates_and_budget
  - mutation_findings_never_create_or_change_development_work_automatically
  - local_integrations_are_optional_project_owned_state
  - absent_integrations_never_block_clean_forge_workflows
  - integration_registration_never_grants_implicit_invocation
  - unsupported_integrations_block_only_their_consumers
  - framework_upgrade_never_invokes_local_connectors
  - external_work_lifecycle_is_owned_by_forge_canonical_documents
  - blocked_by_is_metadata_not_a_lifecycle_status
  - no_more_than_one_nonterminal_active_work_epic
  - multiple_execution_planned_workspaces_are_allowed
  - execution_planned_requires_epic_status_PLANNED_and_readiness_READY
  - execution_planned_requires_approved_plan_and_TASK_definitions
  - one_epic_has_at_most_one_execution_workspace
  - epic_start_atomically_moves_planned_workspace_to_active_and_updates_backlog
  - no_more_than_one_code_writing_task_in_progress
  - every_approved_task_has_exactly_one_delivery_track
  - delivery_track_is_independent_from_model_tier_and_risk_level
  - missing_or_uncertain_delivery_track_evidence_defaults_to_standard
  - fast_requires_complete_positive_eligibility_and_no_disqualifier
  - fast_never_invokes_reviewer_or_tester
  - fast_assurance_is_bound_to_the_current_whole_implementation_fingerprint
  - fast_eligibility_failure_escalates_monotonically_to_standard
  - standard_never_downgrades_to_fast_after_task_start
  - production_changes_invalidate_prior_review_test_epic_validation_and_fuzzing_results
  - supporting_only_changes_preserve_clean_production_review_and_invalidate_affected_testing
  - only_production_findings_block_strong_review
  - non_production_review_observations_are_advisory
  - full_project_suite_is_an_epic_validation_gate_not_a_task_gate
  - task_check_selection_is_justified_by_changed_and_affected_surfaces
  - tests_are_independent_behavior_evidence_not_implementation_transcriptions
  - unchanged_behavior_contract_requires_fixing_production_not_adapting_tests
  - task_tester_never_silently_expands_to_the_full_project_suite
  - epic_validation_precedes_epic_fuzzing
  - planned_not_applicable_skips_fuzzer_only_with_current_final_evidence
  - planned_applicable_unresolved_or_contradictory_evidence_invokes_fuzzer
  - task_commit_never_precedes_explicit_user_acceptance
  - next_epic_never_starts_automatically
